name: Build and release

# Manual only: Actions -> "Build and release" -> Run workflow.
# Builds the version declared in meson.build and publishes it as release
# <version> (no "v" prefix). Re-running for the same version replaces the
# release assets.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

env:
  LIBDDCCI_REF: "0.4.0"

jobs:
  build:
    name: Build (x86_64 Linux)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make git meson ninja-build pkg-config libgtkmm-3.0-dev

      - name: Build libddcci ${{ env.LIBDDCCI_REF }}
        run: |
          git clone --depth 1 --branch "$LIBDDCCI_REF" \
            https://github.com/TheElevatedOne/libddcci "$RUNNER_TEMP/libddcci"
          # PREFIX on both calls: the .pc file is generated by the first one.
          make -C "$RUNNER_TEMP/libddcci" PREFIX="$RUNNER_TEMP/ddcci"
          make -C "$RUNNER_TEMP/libddcci" PREFIX="$RUNNER_TEMP/ddcci" install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ddcci/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          meson setup build --prefix=/usr --buildtype=release \
            -Dstatic_libddcci=true

      - name: Read version
        id: version
        run: |
          version=$(meson introspect --projectinfo build | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building ddc-controls $version"

      - name: Build
        run: ninja -C build

      - name: Smoke test
        run: |
          ./build/ddc-controls --help > /dev/null
          test "$(./build/ddc-controls --version)" = "ddc-controls ${{ steps.version.outputs.version }}"
          if ldd build/ddc-controls | grep -q libddcci; then
            echo "libddcci must be linked statically"; exit 1
          fi

      - name: Package
        run: |
          version=${{ steps.version.outputs.version }}
          name="ddc-controls-$version-x86_64-linux"
          DESTDIR="$PWD/stage/$name" meson install -C build
          cp LICENSE README.md "stage/$name/"
          mkdir -p dist
          tar -C stage -czf "dist/$name.tar.gz" "$name"
          meson dist -C build --no-tests --formats xztar
          cp build/meson-dist/ddc-controls-$version.tar.xz dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ddc-controls-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ddc-controls-${{ needs.build.outputs.version }}
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists, replacing its assets"
            gh release upload "$tag" dist/* --clobber
          else
            flags=()
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "ddc-controls $VERSION" \
              --generate-notes \
              "${flags[@]}"
          fi
